name: Check build and quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: 1/3 | Checkout repo
        uses: actions/checkout@v7
      - name: 2/3 | Setup Node environment
        uses: actions/setup-node@v7
      - name: 3/3 | Install and cache dependencies
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

  lint_and_build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: 1/6 | Checkout repo
        uses: actions/checkout@v7
      - name: 2/6 | Setup Node environment
        uses: actions/setup-node@v7
      - name: 3/6 | Restore cached dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 4/6 | Run code styling script
        run: npm run format:check
      - name: 5/6 | Run static quality check script
        run: npm run lint
      - name: 6/6 | Run build package script
        run: npm run build

  test:
    needs: lint_and_build
    runs-on: ubuntu-latest
    steps:
      - name: 1/5 | Checkout repo
        uses: actions/checkout@v7
      - name: 2/5 | Setup Node environment
        uses: actions/setup-node@v7
      - name: 3/5 | Restore cached dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 4/5 | Run unit tests suite with coverage
        run: npm run test:coverage
      - name: 5/5 | Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  coverage_and_quality:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 1/4 | Checkout repo
        uses: actions/checkout@v7
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
      - name: 2/4 | Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage/
      - name: 3/4 | Run Codecov Uploader
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: true
          verbose: true
      - name: 4/4 | Run SonarCloud Scanner
        uses: sonarsource/sonarqube-scan-action@v8
        with:
          args: >
            -Dproject.settings=configs/sonar-project.properties
            -Dsonar.projectBaseDir=.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
